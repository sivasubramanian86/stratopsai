name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths: ['frontend/**']
  pull_request:
    branches: [main]
    paths: ['frontend/**']

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: |
          npx eslint src/ --ext .js,.jsx --max-warnings 0

      - name: Run tests
        run: npm test -- --coverage --watchAll=false

      - name: Build application
        run: npm run build
        env:
          REACT_APP_API_URL: https://example.execute-api.us-east-1.amazonaws.com/dev

      - name: Check build size
        run: |
          BUILD_SIZE=$(du -sh build | cut -f1)
          echo "Build size: $BUILD_SIZE"
          
          # Warn if build is larger than 10MB
          BUILD_SIZE_BYTES=$(du -sb build | cut -f1)
          if [ $BUILD_SIZE_BYTES -gt 10485760 ]; then
            echo "⚠️ Warning: Build size is larger than 10MB"
          fi

  amplify-deploy:
    needs: frontend-checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Trigger Amplify build
        run: |
          # Determine environment based on branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev"
          fi
          
          echo "Triggering Amplify build for environment: $ENVIRONMENT"
          
          # Get Amplify App ID
          APP_ID=$(aws cloudformation describe-stacks \
            --stack-name "stratopsai-amplify-${ENVIRONMENT}" \
            --query 'Stacks[0].Outputs[?OutputKey==`AmplifyAppId`].OutputValue' \
            --output text 2>/dev/null || echo "")
          
          if [ ! -z "$APP_ID" ]; then
            # Get branch name
            BRANCH_NAME=$([ "$ENVIRONMENT" = "prod" ] && echo "main" || echo "develop")
            
            # Start build
            aws amplify start-job \
              --app-id "$APP_ID" \
              --branch-name "$BRANCH_NAME" \
              --job-type RELEASE
            
            echo "✅ Amplify build triggered for app: $APP_ID"
          else
            echo "⚠️ Amplify app not found for environment: $ENVIRONMENT"
            echo "Please deploy the Amplify stack first using scripts/deploy-amplify.sh"
          fi