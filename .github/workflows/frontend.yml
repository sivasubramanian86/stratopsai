name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths: ['gui-prototype/**']
  pull_request:
    branches: [main]
    paths: ['gui-prototype/**']

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gui-prototype

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: gui-prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: https://example.execute-api.us-east-1.amazonaws.com/dev

      - name: Check build size
        run: |
          BUILD_SIZE=$(du -sh dist | cut -f1)
          echo "Build size: $BUILD_SIZE"
          
          BUILD_SIZE_BYTES=$(du -sb dist | cut -f1)
          if [ $BUILD_SIZE_BYTES -gt 10485760 ]; then
            echo "⚠️ Warning: Build size is larger than 10MB"
          fi

  vercel-deploy:
    needs: frontend-checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: gui-prototype/package-lock.json

      - name: Install dependencies
        working-directory: ./gui-prototype
        run: npm ci

      - name: Deploy to Vercel
        working-directory: ./gui-prototype
        run: |
          npm install -g vercel
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}